[workspace]
resolver = "2"
members = ["crates/zoetrope-core", "crates/zoetrope-web", "editor/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing, so save → load is lossless (determinism).
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
# Whole-program optimization: smaller and faster WASM. opt-level stays 3
# ("s"/"z" saved only ~3% size at a 25–200% render-speed cost; see
# docs/ARCHITECTURE.md, "WASM build step").
lto = true
codegen-units = 1
