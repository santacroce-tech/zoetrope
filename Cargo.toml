[workspace]
resolver = "2"
members = ["crates/zoetrope-core", "crates/zoetrope-web", "editor/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing, so save → load is lossless (determinism).
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
