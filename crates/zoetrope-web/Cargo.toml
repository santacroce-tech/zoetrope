[package]
name = "zoetrope-web"
description = "WASM bindings for zoetrope-core plus the Canvas2D renderer. Shared by the editor preview and the exported player."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zoetrope-core = { path = "../zoetrope-core" }
serde.workspace = true
serde_json.workspace = true
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
# Pinned to match the wasm-bindgen CLI used by scripts/build-wasm.sh (versions must be identical).
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "CanvasWindingRule",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "ImageBitmap",
  "Window",
  "console",
] }
