# Builds installers for macOS (universal), Windows and Linux and publishes
# them as a GitHub Release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match the version in editor/src-tauri/tauri.conf.json.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: wasm32-unknown-unknown
          - platform: ubuntu-22.04
            args: ""
            rust-targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Git's sh on PATH (Windows; the WASM build script is POSIX sh)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\Program Files\Git\bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
        working-directory: editor
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: editor
          tagName: ${{ github.ref_name }}
          releaseName: Zoetrope ${{ github.ref_name }}
          releaseBody: |
            Downloads for every platform are below; see the website for which one to pick:
            https://santacroce-tech.github.io/zoetrope/#download

            The installers aren't code-signed yet. On macOS, right-click the app and choose Open the first time; on Windows, choose More info → Run anyway.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
